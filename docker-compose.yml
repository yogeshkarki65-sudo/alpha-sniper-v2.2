version: '3.8'

services:
  alpha-sniper:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: "2.2.0"
    container_name: alpha-sniper-v2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    env_file:
      - .env
    # Environment variables for zero-trust validation can be set at runtime:
    # EXPECTED_VERSION=2.2.0 EXPECTED_COMMIT=afd2c6c docker compose up -d
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
